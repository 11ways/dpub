[package]
name = "dpub-convert"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DAISY 2.02 → EPUB 3 conversion built on dpub-core and epub3-writer"

[lints]
workspace = true

[features]
default = []
# Forward to dpub-whisper's GPU acceleration features (Apple-Silicon Metal,
# NVIDIA CUDA). Off by default to keep CI/no-GPU builds working.
metal = ["dpub-whisper/metal"]
cuda = ["dpub-whisper/cuda"]

[dependencies]
dpub-audio = { path = "../dpub-audio", version = "0.6.0" }
dpub-core = { path = "../dpub-core", version = "0.6.0" }
dpub-meta = { path = "../dpub-meta", version = "0.6.0" }
dpub-util = { path = "../dpub-util", version = "0.6.0" }
dpub-whisper = { path = "../dpub-whisper", version = "0.6.0" }
epub3-writer = { path = "../epub3-writer", version = "0.6.0" }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true }
tempfile = "3"

[dev-dependencies]
tempfile = "3"
zip = { workspace = true }

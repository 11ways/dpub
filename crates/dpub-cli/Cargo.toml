[package]
name = "dpub-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the dpub DAISY 2.02 → EPUB 3 toolkit"

[[bin]]
name = "dpub"
path = "src/main.rs"

[lints]
workspace = true

[features]
default = []
# Forward to dpub-convert/dpub-whisper GPU acceleration. Build the CLI with
# `--features metal` on Apple Silicon to make `--transcribe` 5–10× faster.
metal = ["dpub-convert/metal"]
cuda = ["dpub-convert/cuda"]

[dependencies]
dpub-audio = { path = "../dpub-audio", version = "0.5.0" }
dpub-core = { path = "../dpub-core", version = "0.5.0" }
dpub-convert = { path = "../dpub-convert", version = "0.5.0" }
dpub-validate = { path = "../dpub-validate", version = "0.5.0" }
clap = { workspace = true }
anyhow = { workspace = true }
rayon = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walkdir = { workspace = true }

[dev-dependencies]
tempfile = "3"

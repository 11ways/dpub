[workspace]
resolver = "3"
members = [
    "crates/dpub-audio",
    "crates/dpub-core",
    "crates/dpub-cli",
    "crates/dpub-convert",
    "crates/dpub-util",
    "crates/dpub-validate",
    "crates/dpub-whisper",
    "crates/epub3-writer",
]

[workspace.package]
version = "0.1.0-dev"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/11ways/dpub"
homepage = "https://github.com/11ways/dpub"
authors = ["Eleven Ways <hello@elevenways.be>"]

[workspace.dependencies]
quick-xml = { version = "0.36", features = ["serialize"] }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
uuid = { version = "1", features = ["v4"] }
serde_json = "1"
which = "7"
rayon = "1"
walkdir = "2"
whisper-rs = "0.16"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "isomp4", "vorbis"] }
rubato = "0.16"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
